<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星際回合戰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1 class="game-title">星際回合戰</h1>

    <section id="title-screen" class="screen">
      <p class="hint">選擇你的職業（滑鼠點選，或按鍵盤 1、2）</p>
      <div id="class-list" class="class-list"></div>
    </section>

    <section id="intro-screen" class="screen" hidden>
      <div id="intro-lines" class="intro-lines"></div>
      <button id="btn-intro" class="intro-button" type="button"><kbd>1</kbd> 出擊</button>
    </section>

    <section id="battle-screen" class="screen" hidden>
      <p id="stage-label" class="stage-label"></p>
      <div class="stage">
        <canvas id="battle-canvas" aria-label="戰鬥畫面"></canvas>
        <div id="result" class="result" hidden>
          <h2 id="result-title"></h2>
          <p id="result-text"></p>
        </div>
      </div>

      <div class="status-row">
        <div class="status-card" id="enemy-status">
          <div class="status-head"><span class="status-name"></span><span class="status-hp-num"></span></div>
          <div class="bar"><div class="bar-fill hp"></div></div>
          <p class="status-hint"></p>
        </div>
        <div class="status-card" id="player-status">
          <div class="status-head"><span class="status-name"></span><span class="status-hp-num"></span></div>
          <div class="bar"><div class="bar-fill hp"></div></div>
          <div class="status-head mp-head"><span>MP</span><span class="status-mp-num"></span></div>
          <div class="bar bar-thin"><div class="bar-fill mp"></div></div>
        </div>
      </div>

      <div id="actions" class="actions">
        <button id="btn-physical" type="button"><kbd>1</kbd><span class="label">物理攻擊</span></button>
        <button id="btn-magic" type="button"><kbd>2</kbd><span class="label">魔法</span></button>
        <button id="btn-defend" type="button"><kbd>3</kbd><span class="label">防禦（回復 MP）</span></button>
      </div>

      <div id="choices" class="choices" hidden>
        <p id="choices-title" class="choices-title"></p>
        <div id="choices-list" class="choices-list"></div>
      </div>

      <ul id="battle-log" class="log" aria-live="polite"></ul>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
